# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# Biome is the tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code, and it also formats.
# More details at https://biomejs.dev
# and https://biomejs.dev/guides/getting-started/

name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
  schedule:
    - cron: '20 10 * * 3'

jobs:
  lint:
    name: Run biome scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for a private repository to get the Action run status.
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Biome
        run: npm run lint
