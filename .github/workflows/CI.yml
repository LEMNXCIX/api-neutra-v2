name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # Job-level so `npm ci` postinstall (prisma generate) also gets a URL:
    # prisma.config.ts refuses to boot without it. The DB and Redis below are
    # contacted for migrations, the seed and the integration suites, which the
    # ci profile now runs as a blocking check.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-secret
      SESSION_SECRET: ci-secret
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
      # prisma/seed.ts refuses to run without this one: it throws
      # "SUPER_ADMIN_PASSWORD is required" rather than seeding an account
      # nobody could sign into. It has no default, unlike SUPER_ADMIN_EMAIL.
      # A throwaway credential for a database that lives only as long as the
      # job, on the same footing as JWT_SECRET above.
      SUPER_ADMIN_PASSWORD: ci-super-admin-password
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # `migrate deploy` applies the committed migrations and never resets a
      # database, which is the right verb for a CI database.
      - name: Apply database migrations
        run: npx prisma migrate deploy

      # Not optional: the integration suites resolve their tenant from the
      # seeded `superadmin` slug (test/test-client.ts), so without reference
      # data every request 404s on the tenant lookup and the suites report a
      # green run against an empty database.
      - name: Seed reference data
        run: npx prisma db seed

      # --include-integration is what makes the integration check run at all;
      # without it the ci profile skips the eight database-backed suites, which
      # is how a broken assertion in test/slide.test.ts survived unnoticed.
      - name: API Doctor
        run: npm run doctor -- --profile ci --include-integration --format text
